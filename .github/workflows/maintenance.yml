name: Maintenance

# Every 5 minutes: expire unpaid InstaPay orders and prune old counters on the live site.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL     — the live site, e.g. https://anu-essen.vercel.app
#   CRON_SECRET — the same random value set as CRON_SECRET in Vercel
# Without them the job does nothing.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run maintenance
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not configured; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/maintenance"
